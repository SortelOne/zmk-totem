CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Keyboard-controlled screen brightness (&inc_bri / &dec_bri in the keymap).
# Starts at FIXED_BRIGHTNESS on every boot and moves by STEP per press (range 1-100).
CONFIG_PROSPECTOR_BRIGHTNESS_MANUAL=y
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
CONFIG_PROSPECTOR_BRIGHTNESS_STEP=10

